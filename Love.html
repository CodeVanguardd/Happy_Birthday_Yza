<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Love Forever</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      background: #000;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body.fade-out {
      opacity: 0;
      transition: opacity 0.6s;
    }





    /* the animation is drawn in a 450px box: scale it down on small screens */
    #ui {
      position: fixed;
      inset: 0;
      transform: scale(var(--k, 1));
      transform-origin: 50% 50%;
      pointer-events: none;
    }

    #ui .love {
      position: absolute;
      top: 50%;
      left: 50%;
      margin: -225px 0 0 -225px;
      --i: 1;
    }

    #ui .love:last-child .love_word {
      color: #060101;
      font-size: 2rem;
      text-shadow: 0 0 10px #bd0606;
    }

    #ui .love:last-child .love_word {
      color: #FF5C77;
      font-size: 1.4rem;
      text-shadow: 0 0 10px #7e0808;
    }

    #ui .love_word {
      color: #FF5C77;
      font-size: 1.4rem;
      transform: translateY(-100%) rotateZ(-30deg);
      text-shadow: 0 0 10px #7e0808;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    #ui .love_horizontal {
      animation: horizontal 10000ms infinite alternate ease-in-out;
      animation-delay: calc(var(--i) * -300ms);
    }

    #ui .love_vertical {
      animation: vertical 20000ms infinite linear;
      animation-delay: calc(var(--i) * -300ms);
    }

    @keyframes horizontal {
      from {
        transform: translateX(0px);
      }

      to {
        transform: translateX(450px);
      }
    }

    @keyframes vertical {
      0% {
        transform: translateY(180px);
      }

      10% {
        transform: translateY(45px);
      }

      15% {
        transform: translateY(4.5px);
      }

      18% {
        transform: translateY(0px);
      }

      20% {
        transform: translateY(4.5px);
      }

      22% {
        transform: translateY(34.61538px);
      }

      24% {
        transform: translateY(64.28571px);
      }

      25% {
        transform: translateY(112.5px);
      }

      26% {
        transform: translateY(64.28571px);
      }

      28% {
        transform: translateY(34.61538px);
      }

      30% {
        transform: translateY(4.5px);
      }

      32% {
        transform: translateY(0px);
      }

      35% {
        transform: translateY(4.5px);
      }

      40% {
        transform: translateY(45px);
      }

      50% {
        transform: translateY(180px);
      }

      71% {
        transform: translateY(428.57143px);
      }

      72.5% {
        transform: translateY(441.17647px);
      }

      75% {
        transform: translateY(450px);
      }

      77.5% {
        transform: translateY(441.17647px);
      }

      79% {
        transform: translateY(428.57143px);
      }

      100% {
        transform: translateY(180px);
      }
    }

    .nav-button {
      position: fixed;
      bottom: calc(40px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: linear-gradient(0deg, #ff2a2a, #ffbaba);
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nav-button:hover {
      transform: translateX(-50%) translateY(-2px);
    }
  </style>
</head>

<body>
  
  <div id="ui"></div>
  <a href="finalmessages.html" class="nav-button">Next</a>
  <script>
    const N = 100;
    const ui = document.getElementById('ui');
    for (let i = 1; i <= N; i++) {
      const love = document.createElement('div');
      love.className = 'love';
      love.style.setProperty('--i', i);
      const h = document.createElement('div');
      h.className = 'love_horizontal';
      const v = document.createElement('div');
      v.className = 'love_vertical';
      const word = document.createElement('div');
      word.className = 'love_word';
      word.textContent = 'Trixiee';
      v.appendChild(word);
      h.appendChild(v);
      love.appendChild(h);
      ui.appendChild(love);
    }

    function fitHearts() {
      const k = Math.min(1, Math.min(window.innerWidth, window.innerHeight) / 560);
      ui.style.setProperty('--k', k);
    }
    fitHearts();
    window.addEventListener('resize', fitHearts);

    // Handle button click with fade-out
    document.querySelector('.nav-button').addEventListener('click', function(e) {
      e.preventDefault();
      document.body.classList.add('fade-out');
      setTimeout(() => {
        window.location.href = 'finalmessages.html';
      }, 600);
    });
  </script>
<script>
  // Back button on phones: don't stay stuck on a faded-out page
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) document.body.classList.remove('fade-out');
  });
</script>
</body>

</html>
